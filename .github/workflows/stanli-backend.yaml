# The stanli backend gets its own workflow so the runtime download and the
# backend tests stay off the main check matrix.
on:
  push:
    branches:
      - main
    paths:
      - 'R/stan.R'
      - 'R/opts.R'
      - 'R/create.R'
      - 'R/fit.R'
      - 'R/extract.R'
      - 'inst/stan/**'
      - 'tests/testthat/test-stanli-backend.R'
      - '.github/workflows/stanli-backend.yaml'
  pull_request:
    branches:
      - main
    paths:
      - 'R/stan.R'
      - 'R/opts.R'
      - 'R/create.R'
      - 'R/fit.R'
      - 'R/extract.R'
      - 'inst/stan/**'
      - 'tests/testthat/test-stanli-backend.R'
      - '.github/workflows/stanli-backend.yaml'
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

name: stanli-backend

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stanli-backend:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: true
      EPINOW2_SKIP_INTEGRATION: true

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          extra-repositories: |
            https://production.r-multiverse.org/2026-06-15
            https://seantalts.r-universe.dev

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: NA
          extra-packages: |
            any::stanli
            testthat
            local::.

      - name: Install the stanli runtime
        run: stanli::stanli_install()
        shell: Rscript {0}

      - name: Run the stanli backend tests
        run: |
          testthat::test_local(filter = "stanli-backend", stop_on_failure = TRUE)
        shell: Rscript {0}
