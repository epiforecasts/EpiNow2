# The stanr backends get their own workflow because stanr has no binary for
# the runners and takes close to an hour to build from source. Keeping it out
# of the main check matrix means that cost is paid once, on a cache key of its
# own, rather than on every job.
on:
  push:
    branches:
      - main
    paths:
      - 'R/stan.R'
      - 'R/opts.R'
      - 'R/create.R'
      - 'R/fit.R'
      - 'R/extract.R'
      - 'inst/stan/**'
      - 'tests/testthat/test-stanr-backend.R'
      - '.github/workflows/stanr-backend.yaml'
  pull_request:
    branches:
      - main
    paths:
      - 'R/stan.R'
      - 'R/opts.R'
      - 'R/create.R'
      - 'R/fit.R'
      - 'R/extract.R'
      - 'inst/stan/**'
      - 'tests/testthat/test-stanr-backend.R'
      - '.github/workflows/stanr-backend.yaml'
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

name: stanr-backend

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stanr-backend:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: true
      EPINOW2_SKIP_INTEGRATION: true

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          extra-repositories: |
            https://production.r-multiverse.org/2026-06-15
            https://andrjohns.r-universe.dev

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: NA
          extra-packages: |
            any::stanr
            testthat
            local::.

      - name: Run the stanr backend tests
        run: |
          testthat::test_local(filter = "stanr-backend", stop_on_failure = TRUE)
        shell: Rscript {0}
