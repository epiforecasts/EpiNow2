# Workflow derived from https://github.com/r-lib/actions/tree/master/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    paths:
      - 'vignettes/stanr.Rmd.orig'
    branches: [main]
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

name: render-stanr

jobs:
  stanr:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          extra-repositories: |
            https://production.r-multiverse.org/2026-06-15
            https://andrjohns.r-universe.dev

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: NA
          extra-packages: |
            local::.
            any::cmdstanr
            any::stanr

      - name: Install cmdstan
        uses: epinowcast/actions/install-cmdstan@v1
        with:
          cmdstan-version: 'latest'
          num-cores: 2

      - name: Render vignette
        run: |
            setwd("vignettes")
            knitr::knit(
              "stanr.Rmd.orig",
              "stanr.Rmd"
            )
        shell: Rscript {0}

      - name: Upload vignette as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: vignettes
          path: vignettes
  
      - name: Create Pull Request
        if: github.ref == 'refs/heads/main'
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "Automatic Vignette update"
          title: "Update stanr vignette"
          body: "This is an automated pull request to update the stanr vignette."
          branch: "update-stanr-${{ github.run_number }}"
          labels: "documentation"
          add-paths: |
            vignettes
          token: ${{ secrets.GITHUB_TOKEN }}
